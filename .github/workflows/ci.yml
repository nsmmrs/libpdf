name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Analyze Dart code
      run: dart analyze --fatal-infos .
    - name: Check Dart formatting
      run: dart format --output=none --set-exit-if-changed .
    - name: Check the public API against its snapshot
      if: matrix.os == 'ubuntu-latest'
      run: dart run tool/api_check.dart
    - name: Run Dart tests
      run: dart test
  web:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install Dart dependencies
      run: dart pub get
    - name: Compile the library to JavaScript
      run: dart compile js -O2 -o build/web_check.js tool/web_check.dart
    - name: Check that JavaScript writes the same bytes as the VM
      run: |
        vm="$(dart run tool/web_check.dart)"
        js="$(node build/web_check.js)"
        echo "VM: $vm"; echo "JS: $js"
        test "$vm" = "$js"
    - name: Check the package for pub (dry run, nothing is published)
      run: dart pub publish --dry-run
  pdf-tools:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
    - name: Install qpdf, poppler, ImageMagick and librsvg
      run: sudo apt-get update -q && sudo apt-get install -yq qpdf poppler-utils imagemagick librsvg2-bin
    - name: Install Dart dependencies
      run: dart pub get
    - name: Run the tests that check output with qpdf, poppler, ImageMagick and librsvg
      run: dart test --tags pdf-tools
