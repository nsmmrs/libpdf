<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160">
  <g stroke="black" stroke-width="10" fill="none">
    <line x1="20" y1="20" x2="80" y2="20" stroke-linecap="butt"/>
    <line x1="20" y1="45" x2="80" y2="45" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="80" y2="70" stroke-linecap="square"/>
    <polyline points="110,40 140,10 170,40" stroke-linejoin="miter"/>
    <polyline points="110,80 140,50 170,80" stroke-linejoin="round"/>
