  <line x1="10" y1="100" x2="90" y2="100" stroke="blue" stroke-width="4" stroke-dasharray="10 5"/>
  <line x1="10" y1="120" x2="90" y2="120" stroke="red" stroke-width="4" stroke-dasharray="8" stroke-dashoffset="4"/>
  <rect x="10" y="130" width="80" height="20" fill="yellow" stroke="green" stroke-width="6" stroke-opacity="0.5"/>
