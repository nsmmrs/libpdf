<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160">
  <defs>
    <linearGradient id="lg">
      <stop offset="0" stop-color="red"/>
      <stop offset="0.5" stop-color="yellow"/>
      <stop offset="1" stop-color="blue"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1" href="#lg"/>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="190" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#0f0"/>
    </linearGradient>
    <radialGradient id="rg">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="darkblue"/>
    </radialGradient>
    <radialGradient id="rg2" cx="0.3" cy="0.3" r="0.7" fx="0.25" fy="0.25">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#c00"/>
    </radialGradient>
    <linearGradient id="fade">
      <stop offset="0" stop-color="purple" stop-opacity="1"/>
      <stop offset="1" stop-color="purple" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="90" height="40" fill="url(#lg)"/>
  <rect x="110" y="10" width="80" height="40" fill="url(#user)"/>
  <rect x="10" y="60" width="40" height="90" fill="url(#lg2)"/>
  <circle cx="90" cy="100" r="35" fill="url(#rg)"/>
  <circle cx="160" cy="100" r="30" fill="url(#rg2)"/>
  <rect x="110" y="135" width="80" height="20" fill="url(#fade)"/>
</svg>
