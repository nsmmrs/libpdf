name: libpdf
description: >-
  A pure-Dart PDF library written from ISO 32000: a writer and a reader,
  fonts, images, drawing, and a box-tree layout engine with pluggable line
  breaking.
version: 0.1.0-dev
# Not publishable while compression and fonts are git dependencies
# (publish them first).
publish_to: none
repository: https://github.com/nsmmrs/libpdf
issue_tracker: https://github.com/nsmmrs/libpdf/issues
topics:
  - pdf
  - layout
  - typesetting

environment:
  sdk: ^3.13.0

dependencies:
  compression:
    git:
      url: https://github.com/nsmmrs/compression.git
      ref: 51b29595a17f9de9455b26c311df06075e50a9b1
  fonts:
    git:
      url: https://github.com/nsmmrs/fonts.git
      ref: 949dab6b6141e206204bd3c4e3c620eee7f7b840
  meta: ^1.16.0
  xml: ^7.1.0

dev_dependencies:
  analyzer: ^14.4.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
