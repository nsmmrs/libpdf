name: libpdf
description: >-
  A pure-Dart PDF library written from ISO 32000: a writer and a reader,
  fonts, images, drawing, and a box-tree layout engine with pluggable line
  breaking.
version: 0.1.0-dev
repository: https://github.com/nsmmrs/libpdf
issue_tracker: https://github.com/nsmmrs/libpdf/issues
topics:
  - pdf
  - layout
  - typesetting

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.16.0
  xml: ^7.1.0

dev_dependencies:
  analyzer: ^14.4.0
  test: ^1.32.0
  very_good_analysis: ^11.0.0
